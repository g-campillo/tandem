[package]
name = "tandem-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
tandem-core = { path = "../tandem-core" }
tandem-codex = { path = "../tandem-codex" }
tandem-checks = { path = "../tandem-checks" }
regex = "1"
toml = "0.8"
# Redirects, DNS pinning, TLS and response decoding are controlled by the broker.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
url = "2"
percent-encoding = "2"
flate2 = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"

[dev-dependencies]
tempfile = "3"
