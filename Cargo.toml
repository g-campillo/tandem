[workspace]
members = ["crates/tandem-editor-probe", "crates/tandem-lsp", "crates/tandem-core", "crates/tandem-terminal", "crates/tandem", "crates/tandem-claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde_json = "1.0"
libc = "0.2"

# File fingerprints (tool trust, takeover snapshots) are hashed often; keep that fast in development builds.
[profile.dev.package.sha2]
opt-level = 3
