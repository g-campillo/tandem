[workspace]
members = ["crates/tandem-codex", "crates/tandem-probe", "crates/tandem-editor-probe", "crates/tandem-lsp", "crates/tandem-core", "crates/tandem-terminal", "crates/tandem", "crates/tandem-checks", "crates/tandem-companion", "crates/tandem-agent", "crates/tandem-claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde_json = "1.0"
libc = "0.2"

# Executable fingerprints are checked before local tool execution. Keep those
# hashes fast in the development app without optimizing the whole workspace.
[profile.dev.package.sha2]
opt-level = 3
